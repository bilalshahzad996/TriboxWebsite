<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tribox — Your Digital Partner</title>
    <meta name="description" content="Tribox is a Dubai-based digital transformation partner: Microsoft Dynamics 365 Finance &amp; Operations, Business Central, CRM, Odoo implementation, and mobile &amp; web development." />
    <link rel="canonical" href="https://tribox365.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="color-scheme" content="light dark" />
    <!-- Sets the theme and intro before first paint (kept as a file so the Content Security Policy needs no inline scripts) -->
    <script src="/theme-init.js"></script>
    <!-- Startup screen (development only: the build replaces it with the rendered page). Styled here
         because in development the main stylesheet only arrives once the JavaScript has loaded. -->
    <style>
      .boot { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; background: #f7f9fc; color: #0b1220; }
      :root[data-theme="dark"] .boot { background: #05060b; color: #f3f5fa; }
      .boot .brand { display: inline-flex; align-items: center; gap: 0.08em; height: clamp(2.9rem, 7.7vw, 4.2rem); animation: bootPulse 1.2s ease-in-out infinite alternate; }
      .boot .brand-word { height: 100%; aspect-ratio: 553 / 153; background: currentColor; -webkit-mask: url('/logos/tribox-wordmark.png') center / contain no-repeat; mask: url('/logos/tribox-wordmark.png') center / contain no-repeat; }
      .boot .brand-bars { height: 100%; width: auto; }
      @keyframes bootPulse { from { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .boot .brand { animation: none; } }
    </style>

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tribox" />
    <meta property="og:url" content="https://tribox365.com/" />
    <meta property="og:title" content="Tribox — Your Digital Partner" />
    <meta property="og:description" content="Digital transformation and automation for your business: Dynamics 365, Business Central, CRM, Odoo, and mobile &amp; web apps." />
    <meta property="og:image" content="https://tribox365.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tribox — Your digital partner" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tribox — Your Digital Partner" />
    <meta name="twitter:description" content="Dynamics 365, Business Central, CRM, Odoo, and mobile &amp; web apps." />
    <meta name="twitter:image" content="https://tribox365.com/og-image.png" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tribox",
        "legalName": "Tribox FZCO",
        "url": "https://tribox365.com/",
        "logo": "https://tribox365.com/logos/tribox-logo.png",
        "email": "sales@tribox365.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dubai Silicon Oasis, Dubai",
          "addressCountry": "AE"
        },
        "location": [
          {
            "@type": "Place",
            "name": "Tribox Lahore",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "460, Block G3, Phase 2, Johar Town",
              "addressLocality": "Lahore",
              "postalCode": "54000",
              "addressCountry": "PK"
            }
          }
        ],
        "sameAs": ["https://www.linkedin.com/company/tribox-private-limited/"],
        "knowsAbout": [
          "Microsoft Dynamics 365 Finance and Operations",
          "Microsoft Dynamics 365 Business Central",
          "Microsoft Dynamics 365 Customer Experience",
          "Odoo Implementation",
          "Mobile Application Development",
          "Web Application Development"
        ]
      }
    </script>
  </head>
  <body>
    <!-- The built page already contains the content: without JavaScript, just skip the animations -->
    <noscript>
      <style>
        .boot, .preloader { display: none; }
        .reveal, .reveal .mask-inner { opacity: 1; transform: none; }
      </style>
    </noscript>
    <!-- Startup screen for development; the build replaces everything between the app markers with the rendered page -->
    <div id="root"><!--app-->
      <div class="boot" aria-hidden="true">
        <span class="brand">
          <span class="brand-word"></span>
          <svg class="brand-bars" viewBox="558 0 193 153">
            <rect x="558" y="0" width="134" height="49" fill="#7ddcff" />
            <rect x="617" y="52" width="134" height="49" fill="#4fafd1" />
            <rect x="593" y="104" width="134" height="49" fill="#7ddcff" />
          </svg>
        </span>
      </div>
    <!--/app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
